import org.apache.tools.ant.filters.ReplaceTokens
import org.mtr.mod.BuildTools

plugins {
	id "net.minecraftforge.gradle" version "6.+"
	id "org.spongepowered.mixin" version "+"
}


final BuildTools buildTools = new BuildTools(minecraftVersion, "forge", project)

minecraft {
	mappings channel: "official", version: minecraftVersion
	runs {
		configureEach {
			property "forge.logging.markers", "REGISTRIES"
			property "forge.logging.console.level", "debug"
		}
		client {}
		server { args "--nogui" }
	}
}

sourceSets.main.resources { srcDir "src/generated/resources" }

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		forRepositories(fg.repository) // Only add this if you're using ForgeGradle, otherwise remove this line
		filter {
			includeGroup "maven.modrinth"
		}
	}
}
dependencies {
	minecraft "net.minecraftforge:forge:${minecraftVersion}-${buildTools.getForgeVersion()}"
	annotationProcessor "org.spongepowered:mixin:+:processor"
	implementation fg.deobf("maven.modrinth:minecraft-transit-railway:FORGE-${mtrVersion}+${minecraftVersion}")
	implementation fg.deobf("maven.modrinth:jcm:v${jcmVersion}+${minecraftVersion}")
	//implementation fg.deobf("maven.modrinth:filters-api:${filterAPIVersion}+${minecraftVersion}")

	//compileOnly 'systems.manifold:manifold-preprocessor:2025.1.1'
	//annotationProcessor 'systems.manifold:manifold-preprocessor:+'
}

//Filter API
/*tasks.withType(JavaCompile).configureEach {
	def versionParts = minecraftVersion.split("\\.")
	def major = versionParts[0]
	def minor = versionParts[1]
	def patch = versionParts.length > 2 ? versionParts[2].padLeft(2, '0') : "00"
	def versionInt = "${major}${minor}${patch}"

	options.compilerArgs += [
			"-Xplugin:Manifold",
			"-AMC_VERSION=${versionInt}"
	]
}*/

tasks.named('javadoc') {
	enabled = false
}
//---

mixin {
	add sourceSets.main, "mtr.refmap.json"
	config "mtr.mixins.json"
	debug.verbose = true
	debug.export = true
}

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(buildTools.javaLanguageVersion))
	}
	withSourcesJar()
	withJavadocJar()
}

tasks.register("setupFiles") {
	copy {
		outputs.upToDateWhen { false }
		from "src/main/mods.template.toml"
		into "src/main/resources/META-INF"
		filter(ReplaceTokens, tokens: ["minecraft": minecraftVersion, "version": version])
		rename "(.+).template.toml", "\$1.toml"
	}

	delete fileTree("src/main/java/net/bte/mod")
	delete fileTree("src/main/resources/assets")
	delete fileTree("src/main/resources/data")

	copy {
		outputs.upToDateWhen { false }
		from "../fabric/src/main/java/net/bte/mod"
		into "src/main/java/net/bte/mod"
	}

	copy {
		outputs.upToDateWhen { false }
		from "../fabric/src/main/resources/assets"
		into "src/main/resources/assets"
	}

	copy {
		outputs.upToDateWhen { false }
		from "../fabric/src/main/resources/data"
		into "src/main/resources/data"
	}
}


build {
	doLast {
		buildTools.copyBuildFile()
	}
}
